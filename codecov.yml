codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
      macos:
        flags:
          - macos
        target: auto
        threshold: 1%
      windows:
        flags:
          - windows
        target: auto
        threshold: 1%
        informational: true
      linux:
        flags:
          - linux
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%

flags:
  macos:
    paths:
      - albor/
    carryforward: true
  windows:
    paths:
      - albor/
    carryforward: true
  linux:
    paths:
      - albor/
    carryforward: true

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 1%
  individual_components:
    - component_id: platform
      name: Platform
      paths:
        - albor/platform/**
        - "**/*.macos.mm"
        - "**/*.win32.c++"
        - "**/*.linux.c++"
    - component_id: render
      name: Rendering
      paths:
        - albor/render/**
    - component_id: ui
      name: UI & Layout
      paths:
        - albor/ui/**
        - albor/layout/**
        - albor/widgets/**
    - component_id: text
      name: Text & Fonts
      paths:
        - albor/text/**
    - component_id: compiler
      name: Compiler & Codegen
      paths:
        - albor/compiler/**
        - albor/manifest/**
    - component_id: core
      name: Core & Application
      paths:
        - albor/core/**
        - albor/application/**
        - albor/window/**
        - albor/input/**
        - albor/focus/**
        - albor/animation/**
        - albor/semantics/**
        - albor/accessibility/**
        - albor/i18n/**

ignore:
  - "tests/**"
  - "tools/**"
  - "examples/**"
  - "third-party/**"
  - ".build-*/**"
  - "build/**"
  - "docs/**"

comment:
  layout: "reach,diff,flags,components,files"
  behavior: default
  require_changes: false
  show_carryforward_flags: true

github_checks:
  annotations: true
