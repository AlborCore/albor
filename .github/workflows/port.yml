# the port checks are cheap to run often and expensive to run wide: the drift gate and the staged-install
# fixture accompany every review, while the full port matrix walks the dependency closure on main pushes,
# the nightly schedule and a review that changes packaging paths (AD-16, AD-19)
name: port

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# the pinned tools are the ABI inputs vcpkg caches by; the vcpkg commit is per platform because each image seeds its own
env:
  CMAKE_VERSION: 4.4.4
  NINJA_VERSION: 1.13.2
  MSVC_TOOLSET: 14.51.36231
  WINDOWS_SDK: 10.0.26100.0
  VCPKG_ABI_POLICY: pinned-toolchain-v2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # the port never drifts from the project, which the fast gate checks before any build spends runners (AD-19)
  consistency:
    name: check-port
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: the checked drift gate
        run: bash build/check-port.sh

  # a review that changes packaging inputs carries the full matrix, because its own portfile cannot be
  # validated by the fast gate alone (AD-16, AD-19)
  changes:
    name: packaging changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packaging: ${{ steps.detect.outputs.packaging }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: the review changes a packaging input
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git diff --quiet FETCH_HEAD HEAD -- \
            .triplets \
            CMakeLists.txt \
            build/AlborComponent.cmake \
            build/albor-config.cmake.in \
            build/check-port.sh \
            ports/albor \
            tests/port-consumer \
            tests/port-consumer-blend2d \
            vcpkg-configuration.json \
            vcpkg.json \
            .github/workflows/port.yml
          then
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          fi

  # the staged install fixture, which consumes the default feature surface through find_package alone (§3.3, AD-19)
  fixture:
    name: fixture (${{ matrix.name }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-15
            vcpkg-commit: 866e9e258a76437074a5cf02d4c2d71b53bff2f8
            setup: |
              # the vcpkg binary cache root must exist before vcpkg runs
              mkdir -p .vcpkg-cache
              # the compiler runs through ccache, which the runner image does not ship
              HOMEBREW_NO_AUTO_UPDATE=1 brew install ccache
              # ccache cuts the staged build to its misses after the first review (AD-16)
              ccache --max-size 2G
              # the preset is c++23, so take the newest xcode the image carries rather than its default
              sudo xcode-select --switch "$(ls -d /Applications/Xcode_[0-9]*.app | grep -v beta | sort -V | tail -n 1)"
          - name: windows
            os: windows-latest
            vcpkg-commit: 8c5c88430ac864cf4fe8de4be61f69f003d23ffe
            setup: |
              # the vcpkg binary cache root must exist before vcpkg runs
              mkdir -p .vcpkg-cache
              # the compiler runs through ccache, which the runner image does not ship
              choco install ccache --no-progress -y
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      MACOSX_DEPLOYMENT_TARGET: 13.3
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v7
      - name: platform setup
        run: ${{ matrix.setup }}
      - name: msvc environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: ${{ env.MSVC_TOOLSET }}
          sdk: ${{ env.WINDOWS_SDK }}
      - name: pinned cmake
        uses: lukka/get-cmake@v4.4.4
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: ${{ env.NINJA_VERSION }}
      - name: pinned vcpkg
        uses: lukka/run-vcpkg@v11.6
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: ${{ matrix.vcpkg-commit }}
          vcpkgJsonGlob: tests/consumer/vcpkg.json
          doNotCache: true
      # the msvc action repoints VCPKG_ROOT at the image's bundled vcpkg, so the pinned checkout is restored here
      - name: pin the vcpkg root
        run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"
      - name: toolchain fingerprint
        id: toolchain
        run: echo "fingerprint=$(bash build/toolchain-fingerprint.sh)" >> "$GITHUB_OUTPUT"
      - name: restore the vcpkg binary cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-fixture-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('tests/consumer/vcpkg.json', 'tests/consumer/vcpkg-configuration.json', '.triplets/**') }}
          restore-keys: |
            vcpkg-fixture-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-
            vcpkg-fixture-${{ runner.os }}-
      - name: restore the ccache directory
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-
      - name: staging build with the port's default features
        run: |
          # the stage resolves its dependencies through the test bed's manifest, which the drift gate keeps
          # equal to the port's default matrix, so no package job ever walks the skia closure (AD-26, issue 111)
          cmake -S . -B .build-port-stage -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            ${{ runner.os == 'Windows' && '-DVCPKG_INSTALL_OPTIONS=--x-abi-tools-use-exact-versions' || '' }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DVCPKG_MANIFEST_DIR="$PWD/tests/consumer" \
            -DALBOR_EXAMPLES=OFF -DALBOR_TESTS=OFF \
            -DALBOR_RENDERER_SKIA=OFF -DALBOR_RENDERER_BLEND2D=OFF
          cmake --build .build-port-stage --parallel 4
      - name: install the staged package
        run: cmake --install .build-port-stage --prefix .build-port-stage/stage
      - name: build the consumer against the stage
        run: |
          # the package is built in Release, which the consumer pins, because a mismatched MSVC runtime is a link error (AD-19)
          cmake -S tests/consumer -B .build-port-fixture -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            ${{ runner.os == 'Windows' && '-DVCPKG_INSTALL_OPTIONS=--x-abi-tools-use-exact-versions' || '' }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DVCPKG_INSTALLED_DIR="$(pwd)/.build-port-stage/vcpkg_installed" \
            -DCMAKE_PREFIX_PATH="$(pwd)/.build-port-stage/stage"
          cmake --build .build-port-fixture
      - name: save the vcpkg binary cache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-fixture-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('tests/consumer/vcpkg.json', 'tests/consumer/vcpkg-configuration.json', '.triplets/**') }}

  # the overlay port consumption end to end, which walks the dependency closure and belongs to the evidence
  # a main push, the nightly or a packaging review carries, not to every review (AD-16, AD-19)
  port:
    name: port (${{ matrix.name }})
    if: github.event_name != 'pull_request' || needs.changes.outputs.packaging == 'true'
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-default
            os: macos-15
            consumer: tests/port-consumer
            vcpkg-commit: 866e9e258a76437074a5cf02d4c2d71b53bff2f8
          - name: macos-blend2d
            os: macos-15
            consumer: tests/port-consumer-blend2d
            vcpkg-commit: 866e9e258a76437074a5cf02d4c2d71b53bff2f8
          - name: macos-pinned-release
            os: macos-15
            consumer: tests/port-consumer
            vcpkg-commit: 866e9e258a76437074a5cf02d4c2d71b53bff2f8
            pinned: true
          - name: windows-default
            os: windows-latest
            consumer: tests/port-consumer
            vcpkg-commit: 8c5c88430ac864cf4fe8de4be61f69f003d23ffe
          - name: windows-blend2d
            os: windows-latest
            consumer: tests/port-consumer-blend2d
            vcpkg-commit: 8c5c88430ac864cf4fe8de4be61f69f003d23ffe
          - name: windows-pinned-release
            os: windows-latest
            consumer: tests/port-consumer
            vcpkg-commit: 8c5c88430ac864cf4fe8de4be61f69f003d23ffe
            pinned: true
    # the pinned entries consume the release, which the portfile answers through its REF (AD-19)
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      MACOSX_DEPLOYMENT_TARGET: 13.3
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite'
      # the port builds the checked-out tree while the pinned commit predates the packaging, which the portfile announces (AD-19)
      ALBOR_PORT_SOURCE_PATH: ${{ github.workspace }}
      # vcpkg's clean port environment keeps this variable without adding it to the ABI
      VCPKG_KEEP_ENV_VARS: ALBOR_PORT_SOURCE_PATH
    steps:
      - uses: actions/checkout@v7
      - name: platform setup
        run: |
          # the vcpkg binary cache root must exist before vcpkg runs
          mkdir -p .vcpkg-cache
          if [ "${{ runner.os }}" = "macOS" ]; then
            # the compiler runs through ccache, which the runner image does not ship
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ccache
            # ccache cuts the port build to its misses after the first run (AD-16)
            ccache --max-size 2G
            # the preset is c++23, so take the newest xcode the image carries rather than its default
            sudo xcode-select --switch "$(ls -d /Applications/Xcode_[0-9]*.app | grep -v beta | sort -V | tail -n 1)"
          else
            choco install ccache --no-progress -y
          fi
      - name: msvc environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: ${{ env.MSVC_TOOLSET }}
          sdk: ${{ env.WINDOWS_SDK }}
      - name: pinned cmake
        uses: lukka/get-cmake@v4.4.4
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: ${{ env.NINJA_VERSION }}
      - name: pinned vcpkg
        uses: lukka/run-vcpkg@v11.6
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: ${{ matrix.vcpkg-commit }}
          vcpkgJsonGlob: ${{ matrix.consumer }}/vcpkg.json
          doNotCache: true
      # the msvc action repoints VCPKG_ROOT at the image's bundled vcpkg, so the pinned checkout is restored here
      - name: pin the vcpkg root
        run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"
      - name: toolchain fingerprint
        id: toolchain
        run: echo "fingerprint=$(bash build/toolchain-fingerprint.sh)" >> "$GITHUB_OUTPUT"
      - name: restore the ccache directory
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-
      - name: restore the vcpkg binary cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-port-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-${{ matrix.consumer }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'tests/port-consumer/vcpkg.json', 'tests/port-consumer-blend2d/vcpkg.json', '.triplets/**', 'ports/albor/**') }}
          restore-keys: |
            vcpkg-port-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-${{ matrix.consumer }}-
            vcpkg-port-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-
            vcpkg-port-${{ runner.os }}-
      - name: consume the overlay port end to end
        run: |
          # the consumer's manifest would name a published version one day, which the overlay answers today (AD-19)
          released_includes=OFF
          if [ "${{ matrix.pinned }}" != "true" ]; then
            # a source-tree entry builds the working tree, which the portfile announces as unpinned (AD-19)
            export ALBOR_PORT_SOURCE_PATH="${{ github.workspace }}"
          else
            # the pinned entry consumes the release, which vcpkg_from_git fetches from the pinned REF (AD-19)
            unset ALBOR_PORT_SOURCE_PATH
            # a release cut before the albor/ folder exports the bare module paths, which the source names explicitly (AD-19)
            released_includes=ON
          fi
          cmake -S ${{ matrix.consumer }} -B .build-port-consumer -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            ${{ runner.os == 'Windows' && '-DVCPKG_INSTALL_OPTIONS=--x-abi-tools-use-exact-versions' || '' }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DALBOR_CONSUMER_RELEASED_INCLUDES=$released_includes \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build .build-port-consumer
      - name: save the vcpkg binary cache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-port-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-${{ matrix.consumer }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'tests/port-consumer/vcpkg.json', 'tests/port-consumer-blend2d/vcpkg.json', '.triplets/**', 'ports/albor/**') }}
