name: nightly-cache

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read

# the pinned tools are the ABI inputs vcpkg caches by; the vcpkg commit is per platform because each image seeds its own
env:
  CMAKE_VERSION: 4.4.4
  NINJA_VERSION: 1.13.2
  MSVC_TOOLSET: 14.51.36231
  WINDOWS_SDK: 10.0.26100.0
  VCPKG_ABI_POLICY: pinned-toolchain-v2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-release
            os: macos-15
            enable: true
            preset: release
            vcpkg-commit: 866e9e258a76437074a5cf02d4c2d71b53bff2f8
            setup: |
              # the vcpkg binary cache root must exist before vcpkg runs
              mkdir -p .vcpkg-cache
              # the preset launches the compiler through ccache, which the runner image does not ship
              HOMEBREW_NO_AUTO_UPDATE=1 brew install ccache
              ccache --max-size 2G
              # the preset is c++23, so take the newest xcode the image carries rather than its default
              sudo xcode-select --switch "$(ls -d /Applications/Xcode_[0-9]*.app | grep -v beta | sort -V | tail -n 1)"
          - name: windows-release
            os: windows-latest
            enable: true
            preset: release
            vcpkg-commit: 8c5c88430ac864cf4fe8de4be61f69f003d23ffe
            setup: |
              # the vcpkg binary cache root must exist before vcpkg runs
              mkdir -p .vcpkg-cache
              # the preset launches the compiler through ccache, which the runner image does not ship
              choco install ccache --no-progress -y
          - name: linux-release
            os: ubuntu-latest
            enable: false
            preset: release
            vcpkg-commit: 866e9e258a76437074a5cf02d4c2d71b53bff2f8
            setup: sudo apt-get update && sudo apt-get install -y ccache
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      MACOSX_DEPLOYMENT_TARGET: 13.3
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v7
        if: matrix.enable

      - name: platform setup
        if: matrix.enable
        run: ${{ matrix.setup }}

      - name: msvc environment
        if: matrix.enable && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: ${{ env.MSVC_TOOLSET }}
          sdk: ${{ env.WINDOWS_SDK }}

      - name: pinned cmake
        if: matrix.enable
        uses: lukka/get-cmake@v4.4.4
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: ${{ env.NINJA_VERSION }}

      - name: pinned vcpkg
        if: matrix.enable
        uses: lukka/run-vcpkg@v11.6
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: ${{ matrix.vcpkg-commit }}
          vcpkgJsonGlob: vcpkg.json
          doNotCache: true

      # the msvc action repoints VCPKG_ROOT at the image's bundled vcpkg, so the pinned checkout is restored here
      - name: pin the vcpkg root
        if: matrix.enable
        run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

      - name: toolchain fingerprint
        id: toolchain
        if: matrix.enable
        run: echo "fingerprint=$(bash build/toolchain-fingerprint.sh)" >> "$GITHUB_OUTPUT"

      - name: restore the vcpkg binary cache
        if: matrix.enable
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-
            vcpkg-${{ runner.os }}-

      - name: restore the ccache directory
        if: matrix.enable
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.preset }}-

      - name: configure
        if: matrix.enable
        run: cmake --preset ${{ matrix.preset }} ${{ runner.os == 'Windows' && '-DVCPKG_INSTALL_OPTIONS=--x-abi-tools-use-exact-versions' || '' }}

      - name: build
        if: matrix.enable
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4
