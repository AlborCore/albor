name: build

on:
  push:
    branches:
      - main
      - framework-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            vcpkg-root: /usr/local/share/vcpkg
            setup: |
              # the release preset launches the compiler through ccache, which the runner image does not ship
              HOMEBREW_NO_AUTO_UPDATE=1 brew install ccache
              ccache --max-size 2G
              # the preset is c++23, so take the newest xcode the image carries rather than its default
              sudo xcode-select --switch "$(ls -d /Applications/Xcode_[0-9]*.app | grep -v beta | sort -V | tail -n 1)"
          # windows (win32 + direct3d) is disabled until a win32 platform backend exists:
          # platform/macos is added unconditionally by the top level CMakeLists.txt
          # - name: Windows
          #   os: windows-latest
          #   vcpkg-root: C:\vcpkg
          #   setup: choco install ccache
          # linux (wayland/x11 + vulkan) is disabled for the same reason as windows
          # - name: Linux
          #   os: ubuntu-latest
          #   vcpkg-root: /usr/local/share/vcpkg
          #   setup: sudo apt-get update && sudo apt-get install -y ccache
    env:
      VCPKG_ROOT: ${{ matrix.vcpkg-root }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: platform setup
        run: ${{ matrix.setup }}

      - name: restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: restore the ccache directory
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: configure (release preset)
        run: cmake --preset release

      - name: build (release preset)
        run: cmake --build --preset release --parallel 4
