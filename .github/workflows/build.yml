name: build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CMAKE_VERSION: 4.4.4
  NINJA_VERSION: 1.13.2
  MSVC_TOOLSET: 14.44
  WINDOWS_SDK: 10.0.22621.0
  VCPKG_ABI_POLICY: pinned-toolchain-v2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-pr:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      has_pr: ${{ steps.check.outputs.has_pr }}
    steps:
      - name: Check for open PR
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -skf -H "Authorization: token $GITHUB_TOKEN" "${GITHUB_API_URL}/repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:${{ github.ref_name }}&state=open&per_page=1" 2>&1)
          echo "API response: ${response}"
          count=$(echo "$response" | grep -c '"number"' || true)
          echo "has_pr=$( [ "$count" -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT

  shaders-macos:
    name: shaders (macos)
    needs: [check-pr]
    if: |-
      !cancelled() &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main' || needs.check-pr.outputs.has_pr != 'true')
    runs-on: macos-15
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          xcrun -sdk macosx metal --version > /dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: shader
        run: bash build/shaders.sh

  shaders-windows:
    name: shaders (windows)
    needs: [check-pr]
    if: |-
      !cancelled() &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main' || needs.check-pr.outputs.has_pr != 'true')
    runs-on: windows-2022
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: shader
        run: bash build/shaders.sh --d3d

  shaders-linux:
    name: shaders (linux)
    needs: [check-pr]
    if: |-
      !cancelled() &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main' || needs.check-pr.outputs.has_pr != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y glslang-tools python3
      - name: shader
        run: bash build/shaders.sh --vulkan

  build:
    name: build (${{ matrix.name }})
    needs: [check-pr]
    if: |-
      !cancelled() &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main' || needs.check-pr.outputs.has_pr != 'true')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: read
      code-quality: write
      id-token: write
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-release
            os: macos-15
            enable: true
            preset: release
            vcpkg-commit: 866e9e258a76437074a5cf02d4c2d71b53bff2f8
            setup: |
              # the vcpkg binary cache root must exist before vcpkg runs
              mkdir -p .vcpkg-cache
              # the preset launches the compiler through ccache, which the runner image does not ship
              HOMEBREW_NO_AUTO_UPDATE=1 brew install ccache
              ccache --max-size 2G
              # the framework is c++20, and the build uses the pinned xcode 16.4 rather than the image default
              sudo xcode-select --switch /Applications/Xcode_16.4.app
          - name: macos-debug
            os: macos-15
            enable: true
            preset: debug
            vcpkg-commit: 866e9e258a76437074a5cf02d4c2d71b53bff2f8
            setup: |
              # the vcpkg binary cache root must exist before vcpkg runs
              mkdir -p .vcpkg-cache
              # the preset launches the compiler through ccache, which the runner image does not ship
              HOMEBREW_NO_AUTO_UPDATE=1 brew install ccache
              ccache --max-size 2G
              # the framework is c++20, and the build uses the pinned xcode 16.4 rather than the image default
              sudo xcode-select --switch /Applications/Xcode_16.4.app
          - name: macos-coverage
            os: macos-15
            enable: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
            preset: coverage
            coverage-flag: macos
            coverage-file: coverage.lcov
            cov-profdata: xcrun llvm-profdata
            cov-cov: xcrun llvm-cov
            vcpkg-commit: 866e9e258a76437074a5cf02d4c2d71b53bff2f8
            setup: |
              # the vcpkg binary cache root must exist before vcpkg runs
              mkdir -p .vcpkg-cache
              # the preset launches the compiler through ccache, which the runner image does not ship
              HOMEBREW_NO_AUTO_UPDATE=1 brew install ccache
              ccache --max-size 2G
              # the framework is c++20, and the build uses the pinned xcode 16.4 rather than the image default
              sudo xcode-select --switch /Applications/Xcode_16.4.app
          - name: windows-release
            os: windows-2022
            enable: true
            preset: release
            vcpkg-commit: 8c5c88430ac864cf4fe8de4be61f69f003d23ffe
            setup: |
              # the vcpkg binary cache root must exist before vcpkg runs
              mkdir -p .vcpkg-cache
              # the preset launches the compiler through ccache, which the runner image does not ship
              bash build/install-ccache.sh
          - name: windows-debug
            os: windows-2022
            enable: true
            preset: debug
            vcpkg-commit: 8c5c88430ac864cf4fe8de4be61f69f003d23ffe
            setup: |
              # the vcpkg binary cache root must exist before vcpkg runs
              mkdir -p .vcpkg-cache
              # the preset launches the compiler through ccache, which the runner image does not ship
              bash build/install-ccache.sh
          - name: windows-coverage
            os: windows-2022
            enable: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
            preset: coverage
            coverage-flag: windows
            coverage-file: coverage.xml
            vcpkg-commit: 8c5c88430ac864cf4fe8de4be61f69f003d23ffe
            setup: |
              # the vcpkg binary cache root must exist before vcpkg runs
              mkdir -p .vcpkg-cache
              # msvc has no source-based coverage, so this job also installs the pdb-based collector
              bash build/install-ccache.sh --coverage
          - name: linux-release
            os: ubuntu-24.04
            enable: true
            preset: release
            vcpkg-commit: 866e9e258a76437074a5cf02d4c2d71b53bff2f8
            setup: sudo apt-get update && sudo apt-get install -y ccache libwayland-dev libxkbcommon-dev libpango1.0-dev libcairo2-dev libdbus-1-dev libvulkan-dev libxcb1-dev mesa-vulkan-drivers xvfb weston pkg-config libgl1-mesa-dri libegl1 autoconf autoconf-archive automake libtool
          - name: linux-debug
            os: ubuntu-24.04
            enable: true
            preset: debug
            vcpkg-commit: 866e9e258a76437074a5cf02d4c2d71b53bff2f8
            setup: sudo apt-get update && sudo apt-get install -y ccache libwayland-dev libxkbcommon-dev libpango1.0-dev libcairo2-dev libdbus-1-dev libvulkan-dev libxcb1-dev mesa-vulkan-drivers xvfb weston pkg-config libgl1-mesa-dri libegl1 autoconf autoconf-archive automake libtool
          - name: linux-coverage
            os: ubuntu-24.04
            enable: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
            preset: coverage
            coverage-flag: linux
            coverage-file: coverage.lcov
            cov-c: clang-18
            cov-cxx: clang++-18
            cov-profdata: llvm-profdata-18
            cov-cov: llvm-cov-18
            vcpkg-commit: 866e9e258a76437074a5cf02d4c2d71b53bff2f8
            setup: sudo apt-get update && sudo apt-get install -y ccache clang-18 llvm-18 libwayland-dev libxkbcommon-dev libpango1.0-dev libcairo2-dev libdbus-1-dev libvulkan-dev libxcb1-dev mesa-vulkan-drivers xvfb weston pkg-config libgl1-mesa-dri libegl1 autoconf autoconf-archive automake libtool
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      MACOSX_DEPLOYMENT_TARGET: 13.3
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      LLVM_PROFILE_FILE: ${{ github.workspace }}/coverage-%p.profraw
    steps:
      - uses: actions/checkout@v7
        if: matrix.enable

      - name: platform setup
        if: matrix.enable
        run: ${{ matrix.setup }}

      - name: vulkan driver
        if: matrix.enable && runner.os == 'Linux'
        run: |
          # mesa 25 names the lavapipe icd lvp_icd.json, older releases name it lvp_icd.x86_64.json (AD-22)
          icd=""
          for candidate in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            if [ -f "$candidate" ]; then
              icd="$candidate"
              break
            fi
          done
          # a step that runs without a driver must fail here rather than skip every vulkan test (§6.3)
          if [ -z "$icd" ]; then
            echo "no lavapipe icd under /usr/share/vulkan/icd.d" >&2
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: msvc environment
        if: matrix.enable && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: ${{ env.MSVC_TOOLSET }}
          sdk: ${{ env.WINDOWS_SDK }}

      - name: pinned cmake
        if: matrix.enable
        uses: lukka/get-cmake@v4.4.4
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: ${{ env.NINJA_VERSION }}

      - name: pinned vcpkg
        if: matrix.enable
        uses: lukka/run-vcpkg@v11.6
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: ${{ matrix.vcpkg-commit }}
          vcpkgJsonGlob: vcpkg.json
          doNotCache: true

      - name: pin the vcpkg root
        if: matrix.enable
        run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

      - name: toolchain fingerprint
        id: toolchain
        if: matrix.enable
        run: echo "fingerprint=$(bash build/toolchain-fingerprint.sh)" >> "$GITHUB_OUTPUT"

      - name: restore - vcpkg cache
        if: matrix.enable
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: restore - ccache directory
        if: matrix.enable
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.preset }}-

      - name: configure
        id: configure
        if: matrix.enable
        run: |
          extra=()
          if [ "${{ runner.os }}" = "Windows" ]; then
            extra+=(-DVCPKG_INSTALL_OPTIONS=--x-abi-tools-use-exact-versions)
          fi
          # the llvm coverage jobs pin clang because the profile format and tools must match the compiler
          if [ -n "${{ matrix.cov-cxx }}" ]; then
            extra+=(-DCMAKE_C_COMPILER="${{ matrix.cov-c }}" -DCMAKE_CXX_COMPILER="${{ matrix.cov-cxx }}")
          fi
          cmake --preset ${{ matrix.preset }} "${extra[@]}"

      - name: build
        if: matrix.enable
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4

      - name: build scope
        if: matrix.enable && matrix.preset == 'debug'
        run: bash build/check-build-scope.sh

      - name: unit tests
        if: matrix.enable && !(runner.os == 'Windows' && matrix.preset == 'coverage')
        working-directory: .build-${{ matrix.preset }}/tests
        run: ./albor-tests && ./albor-generated-font-checks

      - name: unit tests (windows coverage)
        if: matrix.enable && runner.os == 'Windows' && matrix.preset == 'coverage'
        working-directory: .build-coverage/tests
        run: |
          root="${GITHUB_WORKSPACE//\\//}"
          OpenCppCoverage --sources "$root/albor" --export_type="cobertura:$root/coverage.xml" --working_dir . -- ./albor-tests.exe
          ./albor-generated-font-checks.exe

      - name: node
        if: matrix.enable && matrix.preset == 'debug'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/albor-vscode/package-lock.json

      - name: language client smoke test
        if: matrix.enable && matrix.preset == 'debug'
        working-directory: tools/albor-vscode
        env:
          ALBOR_LSP: ${{ github.workspace }}/.build-${{ matrix.preset }}/tools/albor-lsp/albor-lsp${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          npm ci
          npm test

      - name: linux wayland tests
        if: matrix.enable && runner.os == 'Linux'
        working-directory: .build-${{ matrix.preset }}/tests
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-0 --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if [ -S "$XDG_RUNTIME_DIR/wayland-0" ]; then
              break
            fi
            sleep 0.1
          done
          if [ ! -S "$XDG_RUNTIME_DIR/wayland-0" ]; then
            cat "$RUNNER_TEMP/weston.log"
            exit 1
          fi
          export WAYLAND_DISPLAY=wayland-0
          ./albor-linux-tests --gtest_filter='-X11Platform.*'

      - name: linux wayland tests at scale 2
        if: matrix.enable && runner.os == 'Linux'
        working-directory: .build-${{ matrix.preset }}/tests
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-scale"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-scale --scale=2 --idle-time=0 > "$RUNNER_TEMP/weston-scale.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if [ -S "$XDG_RUNTIME_DIR/wayland-scale" ]; then
              break
            fi
            sleep 0.1
          done
          if [ ! -S "$XDG_RUNTIME_DIR/wayland-scale" ]; then
            cat "$RUNNER_TEMP/weston-scale.log"
            exit 1
          fi
          export WAYLAND_DISPLAY=wayland-scale
          export ALBOR_EXPECT_SCALE=2
          ./albor-linux-tests --gtest_filter='-X11Platform.*'

      - name: font selection check
        if: matrix.enable && runner.os != 'Linux'
        env:
          ALBOR_BUILD_DIR: .build-${{ matrix.preset }}
        run: bash build/check-font-selection.sh

      - name: linux x11 tests
        if: matrix.enable && runner.os == 'Linux'
        working-directory: .build-${{ matrix.preset }}/tests
        run: |
          Xvfb :99 -screen 0 1280x1024x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if [ -S /tmp/.X11-unix/X99 ]; then
              break
            fi
            sleep 0.1
          done
          export DISPLAY=:99
          unset WAYLAND_DISPLAY
          unset XDG_SESSION_TYPE
          ./albor-linux-tests --gtest_filter='X11Platform.*:AlborVulkanWindowChecks.*'

      - name: linux example smoke on wayland
        if: matrix.enable && runner.os == 'Linux'
        working-directory: .build-${{ matrix.preset }}
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-example"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-example --idle-time=0 > "$RUNNER_TEMP/weston-example.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if [ -S "$XDG_RUNTIME_DIR/wayland-example" ]; then
              break
            fi
            sleep 0.1
          done
          export WAYLAND_DISPLAY=wayland-example
          set +e
          timeout 5 ./examples/hello-world/hello-world-albor
          status=$?
          set -e
          # the example runs until it is closed, so a timeout is the pass and any other exit is a failure
          test "$status" -eq 124

      - name: linux example smoke on x11
        if: matrix.enable && runner.os == 'Linux'
        working-directory: .build-${{ matrix.preset }}
        run: |
          Xvfb :98 -screen 0 1280x1024x24 > "$RUNNER_TEMP/xvfb-example.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if [ -S /tmp/.X11-unix/X98 ]; then
              break
            fi
            sleep 0.1
          done
          export DISPLAY=:98
          unset WAYLAND_DISPLAY
          unset XDG_SESSION_TYPE
          set +e
          timeout 5 ./examples/hello-world/hello-world-albor
          status=$?
          set -e
          # the example runs until it is closed, so a timeout is the pass and any other exit is a failure
          test "$status" -eq 124

      - name: lcov coverage report
        if: matrix.enable && matrix.preset == 'coverage' && runner.os != 'Windows'
        run: |
          ${{ matrix.cov-profdata }} merge -sparse coverage-*.profraw -o coverage.profdata
          objects=()
          for name in albor-tests albor-generated-font-checks albor-render-blend2d-auto-checks albor-render-albor-auto-checks albor-automation-host-tests; do
            path="./.build-coverage/tests/$name"
            if [ ! -f "$path" ] && [ -f "$path.exe" ]; then
              path="$path.exe"
            fi
            if [ -f "$path" ]; then
              if [ ${#objects[@]} -eq 0 ]; then
                objects+=("$path")
              else
                objects+=("-object" "$path")
              fi
            fi
          done
          ${{ matrix.cov-cov }} export --format=lcov -instr-profile=coverage.profdata -ignore-filename-regex='(^|/)tests/' "${objects[@]}" > coverage.lcov
          # the export carries absolute source paths, which the coverage api needs relative to the repository root
          python_bin=python3
          command -v python3 >/dev/null 2>&1 || python_bin=python
          "$python_bin" - <<'PY'
          import os
          root = os.getcwd().replace('\\', '/')
          lines = []
          with open('coverage.lcov', encoding='utf-8') as report:
              for line in report:
                  if line.startswith('SF:'):
                      path = line[3:].strip().replace('\\', '/')
                      if path.startswith(root + '/'):
                          path = path[len(root) + 1:]
                      line = 'SF:' + path + '\n'
                  lines.append(line)
          with open('coverage.lcov', 'w', encoding='utf-8') as report:
              report.writelines(lines)
          PY

      - name: upload coverage to codecov
        if: matrix.enable && matrix.preset == 'coverage'
        uses: codecov/codecov-action@v5
        with:
          files: ${{ matrix.coverage-file }}
          flags: ${{ matrix.coverage-flag }}
          name: ${{ matrix.name }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: save - vcpkg cache
        if: matrix.enable && !cancelled() && steps.configure.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.triplets/**') }}

      - name: save - ccache directory
        if: matrix.enable && !cancelled()
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.preset }}-${{ github.sha }}

  # the RHEL/Alma 9 baseline runs in its own container, because its glibc and libstdc++ floor is what the job proves (§5.3, AD-16)
  # disabled with the linux matrix entries until a Linux host runs the full vcpkg build (docs/linux.md); remove the `if` to enable it
  linux-floor:
    name: build (linux-alma9-release)
    needs: [check-pr]
    if: ${{ false }}
    runs-on: ubuntu-24.04
    container: almalinux:9
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      # checkout needs git, which the AlmaLinux base image does not carry, so the prerequisites come before it
      - name: container prerequisites
        run: dnf install -y git tar gzip

      - uses: actions/checkout@v7

      - name: platform setup
        run: |
          # ninja and ccache are in crb and epel, which the baseline image does not enable
          dnf install -y 'dnf-command(config-manager)'
          dnf config-manager --set-enabled crb
          dnf install -y epel-release
          # wayland-protocols and libdecor are vendored, so the job installs the frame's system libraries instead (AD-16)
          dnf install -y ccache gcc-c++ ninja-build pkgconf-pkg-config libpng-devel wayland-devel libxkbcommon-devel pango-devel cairo-devel dbus-devel mesa-libEGL mesa-dri-drivers weston
          ccache --max-size 2G

      - name: pinned cmake
        uses: lukka/get-cmake@v4.4.4
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: ${{ env.NINJA_VERSION }}

      - name: pinned vcpkg
        uses: lukka/run-vcpkg@v11.6
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: 866e9e258a76437074a5cf02d4c2d71b53bff2f8
          vcpkgJsonGlob: vcpkg.json
          doNotCache: true

      - name: toolchain fingerprint
        id: toolchain
        run: echo "fingerprint=$(bash build/toolchain-fingerprint.sh)" >> "$GITHUB_OUTPUT"

      - name: restore - vcpkg cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-linux-alma9-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.triplets/**') }}
          restore-keys: |
            vcpkg-linux-alma9-
            vcpkg-Linux-

      - name: restore - ccache directory
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-linux-alma9-release-${{ github.sha }}
          restore-keys: |
            ccache-linux-alma9-release-

      - name: configure
        run: cmake --preset release

      - name: build
        run: cmake --build --preset release --parallel 4

      - name: unit tests
        working-directory: .build-release/tests
        run: ./albor-tests && ./albor-generated-font-checks

      - name: linux wayland tests
        working-directory: .build-release/tests
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-0 --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if [ -S "$XDG_RUNTIME_DIR/wayland-0" ]; then
              break
            fi
            sleep 0.1
          done
          if [ ! -S "$XDG_RUNTIME_DIR/wayland-0" ]; then
            cat "$RUNNER_TEMP/weston.log"
            exit 1
          fi
          export WAYLAND_DISPLAY=wayland-0
          ./albor-linux-tests

      - name: linux wayland tests at scale 2
        working-directory: .build-release/tests
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-scale"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-scale --scale=2 --idle-time=0 > "$RUNNER_TEMP/weston-scale.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if [ -S "$XDG_RUNTIME_DIR/wayland-scale" ]; then
              break
            fi
            sleep 0.1
          done
          if [ ! -S "$XDG_RUNTIME_DIR/wayland-scale" ]; then
            cat "$RUNNER_TEMP/weston-scale.log"
            exit 1
          fi
          export WAYLAND_DISPLAY=wayland-scale
          export ALBOR_EXPECT_SCALE=2
          ./albor-linux-tests

      # the baseline artifact must not reference a glibc or libstdc++ newer than Alma 9 carries (AD-16)
      - name: symbol floor
        run: bash build/check-linux-floor.sh .build-release

      - name: save - vcpkg cache
        if: success()
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-linux-alma9-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.triplets/**') }}

      - name: save - ccache directory
        if: success()
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-linux-alma9-release-${{ github.sha }}
