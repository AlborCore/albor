name: release

# publishing a GitHub release is the only automatic release trigger; the dispatch retries an existing
# tag, and the workflow prepares the vcpkg package PR without creating a tag or merging anything (AD-19)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: an existing release tag, for example v0.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-package-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    # drafts never run, and a prerelease is not a stable package whose version parses as CMake project VERSION
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: the release token exists
        run: '[ -n "$RELEASE_PAT" ] || { echo "the RELEASE_PAT secret is unset; the release PR needs it because events raised by GITHUB_TOKEN suppress repository CI (AD-19)"; exit 1; }'
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}

      - name: the release tag is stable, on main and at least the packaged version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          # the tag enters the step through the environment, which a crafty value cannot escape before validation (AD-19)
          if ! printf '%s\n' "$tag" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "the release tag '$tag' is not a stable semver form like v0.2.0"; exit 1
          fi
          version="${tag#v}"
          git fetch --tags --force origin
          if git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null 2>&1; then
            source_tag="$tag"
          elif git rev-parse --verify "refs/tags/v$version^{commit}" >/dev/null 2>&1; then
            source_tag="v$version"
          else
            echo "the release tag '$tag' does not exist"; exit 1
          fi
          commit="$(git rev-parse --verify "refs/tags/$source_tag^{commit}")"
          # a release belongs to main, whose commits are the only source the package pins (AD-19)
          git fetch --no-tags --force origin main
          if ! git merge-base --is-ancestor "$commit" FETCH_HEAD; then
            echo "the tag $source_tag names $commit, which is not on main"; exit 1
          fi
          current="$(python3 -c "import json; print(json.load(open('ports/albor/vcpkg.json')).get('version-semver',''))")"
          python3 - "$version" "$current" <<'PYEOF'
          import re, sys
          version, current = sys.argv[1:3]
          def parts(value):
              match = re.match(r"^([0-9]+)\.([0-9]+)\.([0-9]+)$", value)
              if not match:
                  sys.exit(f"the package version {value!r} is not stable semver")
              return tuple(int(part) for part in match.groups())
          if parts(version) < parts(current):
              sys.exit(f"the release version {version} is older than the packaged {current}")
          print(f"{version} follows {current}")
          PYEOF
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: the package state decides whether the PR is needed
        id: package
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          branch="release/v$VERSION-package"
          # a rerun after the merge is a no-op, and the published state is the whole release (AD-19)
          if grep -qE "^[[:space:]]*REF[[:space:]]+$COMMIT$" ports/albor/portfile.cmake \
            && grep -q "\"version-semver\": \"$VERSION\"" ports/albor/vcpkg.json \
            && grep -qE "^set\(ALBOR_VERSION \"$VERSION\" CACHE STRING" CMakeLists.txt; then
            echo "the package for v$VERSION already names $COMMIT; nothing to prepare"
            echo "prepared=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # an open PR waits for its human review, which a rerun leaves untouched (AD-19)
          state="$(gh pr view "$branch" --json state,url --jq '[.state, .url] | @tsv' 2>/dev/null || true)"
          if [ -n "$state" ]; then
            state_name="${state%%$'\t'*}"
            state_url="${state#*$'\t'}"
            if [ "$state_name" = "OPEN" ]; then
              echo "the package PR is open and waits for review: $state_url"
              echo "prepared=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "the package PR is $state_name; main does not carry it, so delete $branch and rerun: $state_url"; exit 1
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "the branch $branch exists without a PR; delete it and rerun"; exit 1
          fi
          echo "prepared=true" >> "$GITHUB_OUTPUT"

      - name: the package PR moves the version and pin together
        if: steps.package.outputs.prepared == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          version="$VERSION"
          commit="$COMMIT"
          branch="release/v$version-package"
          python3 - "$version" "$commit" <<'PYEOF'
          import pathlib, re, sys

          version, commit = sys.argv[1:3]

          def replace(path, pattern, replacement):
              file = pathlib.Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.M)
              if count != 1:
                  sys.exit(f"{path} carries no line for the release update")
              file.write_text(updated)

          replace(
              "CMakeLists.txt",
              r'^(set\(ALBOR_VERSION ")[^"]*(" CACHE STRING[^\n]*)$',
              rf'\g<1>{version}\g<2>',
          )
          replace(
              "ports/albor/vcpkg.json",
              r'("version-semver"\s*:\s*")[^"]*(")',
              rf'\g<1>{version}\g<2>',
          )
          replace(
              "ports/albor/portfile.cmake",
              r'^(\s*REF\s+)[0-9a-f]{40}\b',
              rf'\g<1>{commit}',
          )
          PYEOF
          grep -qE "^set\(ALBOR_VERSION \"$version\" CACHE STRING" CMakeLists.txt
          grep -q "\"version-semver\": \"$version\"" ports/albor/vcpkg.json
          grep -qE "^[[:space:]]*REF[[:space:]]+$commit$" ports/albor/portfile.cmake
          # the root development manifest is not a release version site and keeps the vcpkg cache key stable (AD-19)
          git diff --quiet -- vcpkg.json
          git diff --check
          git config user.name "albor release bot"
          git config user.email "release@albor.invalid"
          git checkout -b "$branch"
          git add CMakeLists.txt ports/albor/vcpkg.json ports/albor/portfile.cmake
          git commit -m "release: v$version prepares the published package (AD-19)"
          git push origin "$branch"
          pr_url="$(gh pr create --title "release: v$version package" \
            --body "the published release v$version is prepared as the vcpkg package. The port's version is $version and its REF names the published tag commit $commit; the port passes ALBOR_VERSION to the build, so the installed CMake package reports the release version even though the tag predates this version commit. Automation creates no tag and merges nothing (AD-19)." \
            --head "$branch" --base main)"
          echo "package PR: $pr_url"
